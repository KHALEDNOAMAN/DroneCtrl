name: CI
on: [push, pull_request]

jobs:
  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Static cache keys never invalidate, so the first cache written would be
      # restored forever and a dependency bump would never be picked up. Key on
      # the files that decide what actually gets installed.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade pip && pip install platformio
      # platformio.ini lives in firmware/, not at the repo root. Without this,
      # pio exits with NotPlatformIOProjectError before it builds anything.
      - name: Build firmware
        working-directory: firmware
        run: pio run

  simulator:
    name: Simulator (typecheck, build, flight check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Flies the full circuit headlessly and fails on a control-law regression:
      # no laps completed, heading not tracking the route, ground contact, or a
      # result that changes when the timestep changes.
      - name: Flight check
        run: npm run check
