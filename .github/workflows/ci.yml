name: CI
on: [push, pull_request]

jobs:
  # Host tests come first and are the fastest thing here: no toolchain, no
  # board, a couple of seconds. They link the same control, estimation and
  # safety headers the flight controller compiles, so a broken control law is
  # caught before anything spends a minute cross-compiling.
  host-tests:
    name: Host tests (control, estimation, safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: firmware/test
        run: make run

  sil:
    name: Software-in-the-loop flight
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      # Flies nine scenarios against a rigid body model, including injected
      # faults, and fails on a regression in any of them: an unstable loop, an
      # estimator that will not converge, actuator chatter, or a failsafe that
      # does not fire. The legacy-gain scenario is expected to be rejected, so
      # it turns red if the stability criteria are ever weakened.
      - name: Build and fly
        working-directory: firmware/sil
        run: make run
      # Holds the gains fixed and randomises mass, inertia, thrust, arm length
      # and motor lag over a deliberately wide spread. Fails if the pass rate
      # drops below 90 percent, so a change that narrows the envelope the gains
      # tolerate is caught even when every named scenario still passes.
      - name: Monte Carlo robustness
        working-directory: firmware/sil
        run: make monte-carlo
      # Every scenario again, through the MAVLink HIL_SENSOR and
      # HIL_ACTUATOR_CONTROLS bytes the HIL firmware exchanges with a
      # simulator. This is what found the in-flight motor cut on signal loss.
      - name: HIL loopback
        working-directory: firmware/sil
        run: make hil-loopback
      # pymavlink is an independent MAVLink implementation. It reads back
      # every frame of telemetry the SIL wrote, and encodes frames our parser
      # has to decode field for field.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: MAVLink cross-check against pymavlink
        run: |
          python -m pip install --quiet pymavlink
          python tools/mavlink_crosscheck.py firmware/sil/logs
      - name: Upload flight logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sil-flight-logs
          path: |
            firmware/sil/logs/*.csv
            firmware/sil/logs/*.tlog
          if-no-files-found: warn

  # Model in the loop, and the check that it still agrees with the flight code.
  # Runs the C++ harness itself rather than pulling the other job's artifact,
  # so the job is self-contained and the two sides are built from the same
  # checkout. Octave rather than MATLAB, so no licence is needed.
  mil:
    name: MATLAB model and MIL/SIL equivalence
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: sudo apt-get update -qq && sudo apt-get install -y -q --no-install-recommends octave
      - name: Produce the SIL logs
        working-directory: firmware/sil
        run: make run
      - name: Derive the gains from the airframe
        working-directory: matlab
        run: octave-cli tune_gains.m
      - name: MIL and SIL equivalence
        working-directory: matlab
        run: octave-cli verify_mil_sil.m

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Static cache keys never invalidate, so the first cache written would be
      # restored forever and a dependency bump would never be picked up. Key on
      # the files that decide what actually gets installed.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade pip && pip install platformio
      # platformio.ini lives in firmware/, not at the repo root. Without this,
      # pio exits with NotPlatformIOProjectError before it builds anything.
      - name: Build firmware
        working-directory: firmware
        run: pio run

  simulator:
    name: Simulator (typecheck, build, flight check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Flies the full circuit headlessly and fails on a control-law regression:
      # no laps completed, heading not tracking the route, ground contact, or a
      # result that changes when the timestep changes.
      - name: Flight check
        run: npm run check
      # The simulator's HIL session against the firmware's HIL loop, with the
      # SIL binary standing in for the board over a pipe.
      - name: Build the virtual HIL board
        run: make -C ../firmware/sil sil_flight
      - name: HIL check
        run: npm run hil-check

  groundstation:
    name: Ground station (Go)
    runs-on: ubuntu-latest
    needs: host-tests
    defaults:
      run:
        working-directory: groundstation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false # standard library only, nothing to cache
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      # A third reader of the firmware's telemetry, after pymavlink and the
      # firmware's own parser: every log the SIL writes must replay cleanly.
      - name: Replay every SIL log
        run: |
          make -C ../firmware/sil run
          go build -o /tmp/groundstation ./cmd/groundstation
          for f in ../firmware/sil/logs/*.tlog; do
            /tmp/groundstation -replay "$f" -check > /dev/null || exit 1
            echo "ok $f"
          done
      - name: Container image
        run: docker build -t dronectrl-groundstation:ci .
      - name: Save image for the cluster job
        run: docker save dronectrl-groundstation:ci -o /tmp/groundstation-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: groundstation-image
          path: /tmp/groundstation-image.tar
          retention-days: 1

  # Deploys the demo overlay into a throwaway kind cluster and checks the pod
  # comes up ready under the restricted Pod Security Standard and serves a
  # vehicle. Schema validation alone would not catch a probe that never
  # passes or a security context the image cannot run under.
  kubernetes:
    name: Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: groundstation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: groundstation-image
          path: /tmp
      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dronectrl
      - name: Load the image
        run: |
          docker load -i /tmp/groundstation-image.tar
          kind load docker-image dronectrl-groundstation:ci --name dronectrl
      - name: Deploy the demo overlay
        working-directory: groundstation/deploy/k8s/overlays/demo
        run: |
          kustomize edit set image ghcr.io/khalednoaman/dronectrl-groundstation=dronectrl-groundstation:ci
          kubectl apply -k .
          kubectl -n dronectrl rollout status deploy/groundstation --timeout=120s
      - name: Probe the service
        run: |
          kubectl -n dronectrl port-forward svc/groundstation 8080:80 &
          sleep 15
          curl -sf localhost:8080/readyz
          curl -sf localhost:8080/api/vehicles/1 | tee /tmp/vehicle.json
          python3 -c "import json; v=json.load(open('/tmp/vehicle.json')); assert v['connected'], v"
          curl -sf localhost:8080/metrics | grep 'dronectrl_vehicle_connected{system="1"} 1'
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n dronectrl get all
          kubectl -n dronectrl describe pods
          kubectl -n dronectrl logs deploy/groundstation --tail=100
