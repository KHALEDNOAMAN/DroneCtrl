# Build the Zephyr flight target on every commit.
#
# A port that is not built in CI stops building within a month, and then the
# claim it supports is about something that no longer works. This job is what
# keeps the claim true.
#
# Two failures got it here, both worth recording rather than quietly fixing:
#
#   1. `west init -l` with no west.yml in the tree. Correct error: a Zephyr
#      application IS a west manifest repository.
#   2. Container ci:v0.27.4 ships Python 3.10.12, and Zephyr v4.4.2 requires
#      3.12 or newer. The container tag has to track the Zephyr release, so
#      pinning one without the other buys a failure three minutes into a build.
name: zephyr build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: nucleo_f411re
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.29.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - uses: actions/checkout@v5
        with:
          path: dronectrl

      # Printed first and cheaply, because both failures above were invisible
      # until the build was minutes in. A version mismatch should be readable
      # in the first ten lines of the log.
      - name: Toolchain versions
        run: |
          python3 --version
          cmake --version | head -1
          west --version

      - name: Initialise the west workspace
        run: |
          west init -l dronectrl
          west update --narrow -o=--depth=1
          west zephyr-export
          west list

      - name: Build
        run: west build -b nucleo_f411re dronectrl/zephyr --pristine=always

      # The two numbers that decide whether the loop fits on the part. Printed
      # on every build so a regression shows up in a log diff rather than on
      # hardware.
      - name: Report flash and RAM
        run: |
          west build -t rom_report | tail -30
          west build -t ram_report | tail -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zephyr-nucleo_f411re
          path: |
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.hex
            build/zephyr/.config
