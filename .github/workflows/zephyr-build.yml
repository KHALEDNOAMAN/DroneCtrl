# Build the Zephyr flight target on every commit.
#
# A port that is not built in CI stops building within a month, and then the
# claim it supports is about something that no longer works. This job is what
# keeps the claim true.
name: zephyr build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: nucleo_f411re
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.27.4
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      # The repository is the west manifest repository, so it is checked out at
      # a known path and `west init -l` is pointed at it. The first attempt used
      # `west init -l dronectrl` with no west.yml in the tree and failed with
      # "can't init: no west.yml found", which is the correct error: a Zephyr
      # application needs a manifest.
      - uses: actions/checkout@v5
        with:
          path: dronectrl

      - name: Initialise the west workspace
        run: |
          west init -l dronectrl
          west update --narrow -o=--depth=1
          west zephyr-export
          west list

      - name: Build
        run: west build -b nucleo_f411re dronectrl/zephyr --pristine=always

      # The two numbers that decide whether the loop fits on the part. Printed
      # on every build so a regression shows up in a log diff rather than on
      # hardware.
      - name: Report flash and RAM
        run: |
          west build -t rom_report | tail -30
          west build -t ram_report | tail -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zephyr-nucleo_f411re
          path: |
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.hex
            build/zephyr/.config
