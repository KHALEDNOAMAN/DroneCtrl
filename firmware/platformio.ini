; PlatformIO Project Configuration File
; DroneCtrl - Quadcopter Flight Controller
;
; Supported boards: Arduino Nano, ESP32 DevKit
; Plus a `native` environment that builds the control and estimation code for
; the host, so the unit tests and the SIL harness run in CI with no board.
;
; Only libraries that do NOT ship with the selected framework belong in
; lib_deps. Naming a bundled one there (Wire, WiFi, WebServer) sends
; PlatformIO to the registry to resolve a name the framework already provides.
; Servo is the opposite case: the Arduino IDE bundles it, but PlatformIO's
; framework-arduino-avr does not, so it has to be declared explicitly or the
; nano build fails with "Servo.h: No such file or directory".

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; Wire ships with framework-arduino-avr. Servo does not.
lib_deps =
    arduino-libraries/Servo@^1.2.2
; The host tests target `native` only. Without this, `pio test` with no
; environment would try to cross-compile and upload them to a board.
test_ignore = *

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wire ships with arduino-esp32. WiFi and WebServer do too, and nothing in
; firmware/ includes them anyway. ESP32Servo is the one real dependency:
; arduino-esp32 has no Servo library, see the include guard in
; include/motor_mixer.h.
lib_deps =
    ESP32Servo
test_ignore = *

; Host build. Every header under test here is deliberately free of Arduino.h:
; attitude_ekf.h, pid_controller.h, mixer_math.h, flight_state.h and
; can_telemetry.h contain only arithmetic and state, with hardware access left
; to the thin wrappers that include them. That separation is what lets the
; tests and the SIL harness link the same source the flight controller runs,
; rather than a reimplementation of it that could drift.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I include
    -Wall
    -Wextra
    -O2
