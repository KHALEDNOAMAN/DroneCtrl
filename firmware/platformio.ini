; PlatformIO Project Configuration File
; DroneCtrl - Quadcopter Flight Controller
;
; Supported boards: Arduino Nano, ESP32 DevKit
;
; Only libraries that do NOT ship with the selected framework belong in
; lib_deps. Naming a bundled one there (Wire, WiFi, WebServer) sends
; PlatformIO to the registry to resolve a name the framework already provides.
; Servo is the opposite case: the Arduino IDE bundles it, but PlatformIO's
; framework-arduino-avr does not, so it has to be declared explicitly or the
; nano build fails with "Servo.h: No such file or directory".
;
; Only target environments live here, on purpose. `pio run` with no argument
; builds every environment in this file against src/, and src/main.cpp needs
; the Arduino core, so a `native` environment here fails the moment anyone
; runs a plain `pio run`.
;
; The host builds have their own entry points instead, because neither one
; wants src/main.cpp:
;
;   firmware/test  make run   unit tests on the control, estimation and
;                             safety headers, plain g++, no dependencies
;   firmware/sil   make run   those same headers flown against a rigid body
;                             model, with fault injection
;
; Those headers carry no Arduino dependency precisely so the host can compile
; them, which is what lets the tests and the simulator link the exact source
; the flight controller runs rather than a copy of it.

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; Wire ships with framework-arduino-avr. Servo does not.
lib_deps =
    arduino-libraries/Servo@^1.2.2

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wire ships with arduino-esp32. WiFi and WebServer do too, and nothing in
; firmware/ includes them anyway. ESP32Servo is the one real dependency:
; arduino-esp32 has no Servo library, see the include guard in
; include/motor_mixer.h.
lib_deps =
    ESP32Servo
