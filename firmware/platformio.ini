; PlatformIO Project Configuration File
; DroneCtrl - Quadcopter Flight Controller
;
; Supported boards: Arduino Nano, ESP32 DevKit
;
; Only libraries that do NOT ship with the selected framework belong in
; lib_deps. Naming a bundled library there (Wire, Servo, WiFi, WebServer)
; sends PlatformIO to the registry to resolve a name the framework already
; provides, which can fail the build even though the header is on the
; include path.

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; Wire and Servo both ship with framework-arduino-avr, so there is nothing
; external to pull in here.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wire ships with arduino-esp32. WiFi and WebServer do too, and nothing in
; firmware/ includes them anyway. ESP32Servo is the one real dependency:
; arduino-esp32 has no Servo library, see the include guard in
; include/motor_mixer.h.
lib_deps =
    ESP32Servo
