; PlatformIO Project Configuration File
; DroneCtrl - Quadcopter Flight Controller
;
; Supported boards: Arduino Nano, ESP32 DevKit

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
    Wire
    Servo

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    Wire
    ESP32Servo
    WiFi
    WebServer
