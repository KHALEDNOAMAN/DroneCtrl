<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroneCtrl ground station</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header span { color:var(--dim); font-size:13px; }
  main { padding:24px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid currentColor; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; margin:0; }
  dt { color:var(--dim); } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  ol { margin:0; padding-left:18px; color:var(--dim); font-size:12px; }
  .empty { color:var(--dim); padding:24px; }
</style>
</head>
<body>
<header><h1>DroneCtrl ground station</h1><span id="link">connecting</span></header>
<main id="vehicles"><div class="empty">Waiting for MAVLink on UDP. Point a vehicle, or a replay, at this service.</div></main>
<script>
const deg = r => (r * 180 / Math.PI).toFixed(1) + '°';
const cls = v => !v.connected ? 'bad' : v.flight_state.startsWith('FAILSAFE') ? 'bad' : v.armed ? 'ok' : 'warn';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(v) {
  const val = (k, unit) => v.values[k] === undefined ? '-' : v.values[k].toFixed(k.startsWith('ekf') ? 3 : 0) + unit;
  const events = (v.state_events || []).slice(-5).reverse()
    .map(e => `<li>${esc(e.from)} → ${esc(e.to)}${e.fault !== 'NONE' ? ' (' + esc(e.fault) + ')' : ''}</li>`).join('');
  return `<section class="card">
    <div class="top"><strong>System ${v.system_id}${v.hil ? ' <span class="dim">HIL</span>' : ''}</strong>
      <span class="badge ${cls(v)}">${v.connected ? esc(v.flight_state) : 'LINK LOST'}</span></div>
    <dl>
      <dt>fault</dt><dd>${esc(v.fault)}</dd>
      <dt>roll / pitch</dt><dd>${deg(v.roll_rad)} / ${deg(v.pitch_rad)}</dd>
      <dt>battery</dt><dd>${v.battery_volts ? v.battery_volts.toFixed(2) + ' V' : '-'}</dd>
    </dl>
    <h3>Control loop</h3>
    <dl>
      <dt>load</dt><dd>${v.load_percent.toFixed(1)} %</dd>
      <dt>worst jitter</dt><dd>${val('loop_jit', ' µs')}</dd>
      <dt>longest period</dt><dd>${val('loop_max', ' µs')}</dd>
      <dt>missed deadlines</dt><dd>${val('loop_ovr', '')}</dd>
    </dl>
    <h3>Estimator</h3>
    <dl>
      <dt>gyro bias p / q</dt><dd>${val('ekf_bp', '')} / ${val('ekf_bq', '')} °/s</dd>
      <dt>innovation</dt><dd>${val('ekf_inn', ' g')}</dd>
    </dl>
    ${events ? `<h3>State changes</h3><ol>${events}</ol>` : ''}
  </section>`;
}
const es = new EventSource('api/stream');
es.onopen = () => { document.getElementById('link').textContent = 'live'; };
es.onerror = () => { document.getElementById('link').textContent = 'reconnecting'; };
es.onmessage = e => {
  const vs = JSON.parse(e.data);
  if (vs.length) document.getElementById('vehicles').innerHTML = vs.map(card).join('');
};
</script>
</body>
</html>
