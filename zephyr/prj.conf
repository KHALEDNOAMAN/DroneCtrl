# DroneCtrl on Zephyr: application configuration.
#
# Chosen for a hard real-time control loop, so a few of these are the opposite
# of the usual defaults. Each non-obvious one says why.

# --- drivers the loop needs -------------------------------------------------
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y
CONFIG_GPIO=y

# --- C++ for the header-only core -------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP17=y
# No exceptions and no RTTI on a flight target: both put unbounded work on a
# path that has 4 ms to finish, and the core uses neither.
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# --- floating point ---------------------------------------------------------
# The M4F has a single-precision FPU. Without this the EKF and the three PIDs
# compile to soft-float calls and the loop will not close at 250 Hz.
CONFIG_FPU=y
# Save and restore FPU registers per thread. Needed as soon as more than one
# thread touches a float, and far cheaper to enable now than to debug later as
# occasional nonsense in the estimator.
CONFIG_FPU_SHARING=y

# --- scheduling -------------------------------------------------------------
# 1 kHz tick gives 250 Hz an exact divisor, so the period is 4.000 ms rather
# than the nearest representable value.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_TIMESLICING=n
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# --- no dynamic allocation on the control path ------------------------------
# Heap at zero so an accidental malloc fails to link rather than failing in
# flight. The binding uses placement new into static storage for exactly this
# reason. Raising this later should be a deliberate decision with a diff.
CONFIG_HEAP_MEM_POOL_SIZE=0

# --- logging ----------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y    # never block the control thread to format a string
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# --- catching the failures that matter --------------------------------------
# A control thread that overflows its stack on a deep estimator call should trap
# at the overflow, not corrupt a neighbouring thread and fly on.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y

# --- useful during bring-up, remove for flight ------------------------------
CONFIG_STACK_USAGE=y
CONFIG_INIT_STACKS=y
